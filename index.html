<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Firesped Apocrypha – Episode 1</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a12;
      color: #e0e0ff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      line-height: 1.5;
    }
    header {
      text-align: center;
      padding: 2rem 1rem 1rem;
      background: linear-gradient(180deg, #1a1025 0%, #0a0a12 100%);
      border-bottom: 1px solid #3a2a5a;
    }
    header h1 {
      font-size: 1.8rem;
      letter-spacing: 0.05em;
      color: #c9b8ff;
      margin-bottom: 0.3rem;
    }
    header .subtitle {
      font-size: 0.95rem;
      color: #8a7aaa;
    }
    .episode-title {
      text-align: center;
      padding: 1.5rem 1rem 0.5rem;
      font-size: 1.3rem;
      color: #a78bfa;
    }
    .comic-page {
      max-width: 900px;
      margin: 1.5rem auto;
      padding: 0 1rem;
    }
    .comic-page img {
      width: 100%;
      height: auto;
      border-radius: 4px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      display: block;
    }
    .page-label {
      text-align: center;
      font-size: 0.85rem;
      color: #6b5b8a;
      margin-bottom: 0.5rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    footer {
      text-align: center;
      padding: 3rem 1rem 2rem;
      color: #5a4a7a;
      font-size: 0.9rem;
    }
    footer a { color: #a78bfa; text-decoration: none; }
    .nav {
      text-align: center;
      padding: 1rem;
    }
    .nav a {
      display: inline-block;
      margin: 0 0.5rem;
      padding: 0.5rem 1.2rem;
      background: #2a1a4a;
      color: #c9b8ff;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    .nav a:hover { background: #3a2a6a; }
  </style>
</head>
<body>
  <header>
    <h1>The Firesped Apocrypha</h1>
    <div class="subtitle">Final Fantasy XI Fan Webcomic · Season 1: Children of Zvahl</div>
  </header>

  <div class="episode-title">Episode 1 — The Nursery of Shadows</div>

  <div class="comic-page">
    <div class="page-label">Page 1</div>
    <img src="Episode-01-The-Nursery-of-Shadows/page-01.jpg" alt="Episode 1 Page 1">
  </div>

  <div class="comic-page">
    <div class="page-label">Page 2</div>
    <img src="Episode-01-The-Nursery-of-Shadows/page-02.jpg" alt="Episode 1 Page 2">
  </div>

  <div class="comic-page">
    <div class="page-label">Page 3</div>
    <img src="Episode-01-The-Nursery-of-Shadows/page-03.jpg" alt="Episode 1 Page 3">
  </div>

  <div class="nav">
    <a href="#">← Previous</a>
    <a href="#">Next Episode →</a>
  </div>

  <footer>
    <p>End of Episode 1 · To be continued…</p>
    <p style="margin-top:0.8rem">Connected to the Lvl Up! webcomic universe</p>
  </footer>
</body>
</html>
